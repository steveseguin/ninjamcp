<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Two agents, each with a local VDO.Ninja MCP server, connected by a direct encrypted WebRTC data channel. A handshake server helps them connect; a TURN relay is a fallback.">
  <title>How VDO.Ninja MCP works</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #4a4e58; font-size: 13px; }
    .strong { fill: #111318; font-weight: 600; font-size: 14px; }
    .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11.5px; fill: #80848e; }
    .ok { fill: #16a34a; font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #d6d6d0; stroke-width: 1.2; }
    .soft { fill: #f3f3f0; stroke: #e4e4df; stroke-width: 1.2; }
    .machine { fill: none; stroke: #d6d6d0; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .ln { stroke: #80848e; stroke-width: 1.4; fill: none; }
    .dash { stroke: #80848e; stroke-width: 1.3; stroke-dasharray: 4 5; fill: none; }
    .p2p { stroke: #16a34a; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#80848e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="349" rx="20" fill="#fafaf8" stroke="#e4e4df"/>
  <g transform="translate(0 10)">
    <rect class="machine" x="16" y="98" width="346" height="134" rx="16"/>
    <rect class="machine" x="538" y="98" width="346" height="134" rx="16"/>
    <text x="32" y="122" class="mono">MACHINE A</text>
    <text x="868" y="122" class="mono" text-anchor="end">MACHINE B</text>

    <rect class="box" x="32" y="136" width="122" height="80" rx="12"/>
    <text x="93" y="170" class="strong" text-anchor="middle">Agent A</text>
    <text x="93" y="190" text-anchor="middle">MCP client</text>
    <rect class="box" x="214" y="136" width="132" height="80" rx="12"/>
    <text x="280" y="170" class="strong" text-anchor="middle">MCP server</text>
    <text x="280" y="190" class="mono" text-anchor="middle">vdon-mcp-server</text>
    <path class="ln" d="M154 176h58" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="184" y="166" class="mono" text-anchor="middle">stdio</text>

    <rect class="box" x="554" y="136" width="132" height="80" rx="12"/>
    <text x="620" y="170" class="strong" text-anchor="middle">MCP server</text>
    <text x="620" y="190" class="mono" text-anchor="middle">vdon-mcp-server</text>
    <rect class="box" x="746" y="136" width="122" height="80" rx="12"/>
    <text x="807" y="170" class="strong" text-anchor="middle">Agent B</text>
    <text x="807" y="190" text-anchor="middle">MCP client</text>
    <path class="ln" d="M688 176h56" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="716" y="166" class="mono" text-anchor="middle">stdio</text>

    <path class="p2p" d="M348 176h204" marker-end="url(#g)" marker-start="url(#g)"/>
    <text x="450" y="164" class="ok" text-anchor="middle">WebRTC data channel</text>
    <text x="450" y="196" class="mono" text-anchor="middle">DTLS-encrypted</text>

    <rect class="soft" x="370" y="8" width="160" height="56" rx="12"/>
    <text x="450" y="32" class="strong" text-anchor="middle">Handshake server</text>
    <text x="450" y="50" class="mono" text-anchor="middle">wss.vdo.ninja</text>
    <path class="dash" d="M300 136 382 66"/>
    <path class="dash" d="M600 136 518 66"/>
    <text x="300" y="86" class="mono" text-anchor="middle">find peers</text>
    <text x="600" y="86" class="mono" text-anchor="middle">find peers</text>

    <rect class="soft" x="350" y="266" width="200" height="56" rx="12"/>
    <text x="450" y="290" class="strong" text-anchor="middle">TURN relay</text>
    <text x="450" y="308" class="mono" text-anchor="middle">fallback · ciphertext only</text>
    <path class="dash" d="M300 216 382 266"/>
    <path class="dash" d="M600 216 518 266"/>
  </g>
</svg>
